upstream api {
  server server:9000;
}

server {
    listen 80;
    # domain
    server_name domen.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
	listen 443 ssl;
	# domain
    server_name domen.ru;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_certificate /etc/letsencrypt/live/new.cloudmaps.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.cloudmaps.ru/privkey.pem;

	location / {
		root   /usr/share/nginx/html;
		index  index.html;
		try_files $uri $uri/ /index.html;
	}

	location ~ ^/$ {
		rewrite  ^.*$  /index.html  last;
	}


	location /api {
		rewrite /api/(.*) /$1 break;
		proxy_pass http://api;
	}
}

