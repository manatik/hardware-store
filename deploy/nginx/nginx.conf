user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


upstream next {
   server plywood_nextjs:3000;
}

upstream api {
  server plywood_nestjs:4200;
}

server {
    listen 80;
    server_name plywoodmarket.ru;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


server {
  listen 443 ssl;

  server_name plywoodmarket.ru;

  ssl_certificate /etc/letsencrypt/live/plywoodmarket.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/plywoodmarket.ru/privkey.pem;

  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://next;
  }

  location /api {
    proxy_pass http://api;
  }
}

include       /etc/nginx/mime.types;
default_type  application/octet-stream;

log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

access_log  /var/log/nginx/access.log  main;

sendfile        on;
#tcp_nopush     on;

keepalive_timeout  3000;
proxy_read_timeout 3000;
proxy_connect_timeout 3000;
proxy_send_timeout 3000;

#gzip  on;

include /etc/nginx/conf.d/*.conf;

client_body_in_file_only clean;
client_body_buffer_size 31K;
client_max_body_size 299M;
