version: "3.10"

services:
  db:
    image: postgres
    restart: always
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=testik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsql-sock:/var/run/postgresql
    networks:
      - web

  backend:
    image: node:16.15.0
    ports:
      - "9000:9000"
    networks:
      - web
    depends_on:
      - db
    volumes:
      - ../backend:/api
      - pgsql-sock:/var/run/postgresql
      - ../backend/assets:/var/lib/images
    working_dir: /api
    # && yarn typeorm migration:run
    command: bash -c "
      yarn install
      && chmod -R 777 node_modules
      && yarn start:dev"

  frontend:
    image: node:16.15.0
    ports:
      - "3000:3000"
    networks:
      - web
    depends_on:
      - server
    volumes:
      - ../frontend:/frontend
    working_dir: /frontend
    command: bash -c "
      yarn install
      && chmod -R 777 node_modules
      && yarn dev"

volumes:
  pgdata:
  pgsql-sock:

networks:
  web:
