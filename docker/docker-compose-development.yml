version: "3.10"

services:
  db:
    image: postgres
    restart: always
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=testik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsql-sock:/var/run/postgresql
    networks:
      - web

  server:
    image: node:16.15.0
    ports:
      - "9000:9000"
    networks:
      - web
    depends_on:
      - db
    volumes:
      - ../server:/api
      - pgsql-sock:/var/run/postgresql
      - ../server/assets:/var/lib/images
    working_dir: /api
    command: bash -c "
      yarn install
      && yarn typeorm migration:run
      && yarn start:dev"

  client:
    image: node:16.15.0
    ports:
      - "3000:3000"
    networks:
      - web
    depends_on:
      - server
    volumes:
      - ../client:/client
    working_dir: /client
    command: bash -c "
      yarn install
      && yarn start"

volumes:
  pgdata:
  pgsql-sock:

networks:
  web:
