version: "3.10"

x-node-version: &node-version node:16.15.0

services:
  db:
    image: postgres:14.5
    container_name: plywood_db
    restart: always
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=testik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsql-sock:/var/run/postgresql
    networks:
      - web

  backend:
    image: *node-version
    container_name: plywood_nestjs
    networks:
      - web
    depends_on:
      - db
    volumes:
      - ../backend:/api
      - pgsql-sock:/var/run/postgresql
      - ../backend/assets:/var/lib/images
    working_dir: /api
    command: bash -c "
      yarn install
      && yarn prisma migrate deploy
      && yarn prisma db seed
      && yarn start"

  frontend:
    image: *node-version
    container_name: plywood_nextjs
    networks:
      - web
    depends_on:
      - backend
    volumes:
      - ../frontend:/frontend
    working_dir: /frontend
    command: bash -c "
      yarn install
      && yarn build
      && yarn start"

  nginx:
    build: ../deploy/nginx
    container_name: plywood_nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
    depends_on:
      - backend
      - frontend
    volumes:
      - ../deploy/certbot/conf:/etc/letsencrypt
      - ../deploy/certbot/www:/var/www/certbot
    working_dir: /frontend
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: plywood_cert
    volumes:
      - ../deploy/certbot/conf:/etc/letsencrypt
      - ../deploy/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  pgsql-sock:

networks:
  web:
