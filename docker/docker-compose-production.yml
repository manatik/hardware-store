version: "3.10"

services:
  db:
    image: postgres
    restart: always
    ports:
      - "25432:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=testik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsql-sock:/var/run/postgresql
    networks:
      - web

  server:
    image: node:16.15.0
    ports:
      - "9000:9000"
    networks:
      - web
    depends_on:
      - db
    volumes:
      - ../server:/api
      - pgsql-sock:/var/run/postgresql
      - ../server/assets:/var/lib/images
    working_dir: /api
    command: bash -c "
      yarn install
      && yarn typeorm migration:run
      && yarn start:dev"

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
    depends_on:
      - server
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    working_dir: /client
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  pgsql-sock:

networks:
  web:
